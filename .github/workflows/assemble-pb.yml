name: assemble-pb
on:
  push:
    branches: [feat/f7-02-request-dsl]
    paths:
      - "internal/transport/v1/_pb_prefix.txt"
      - "internal/transport/v1/_suffix_probe.txt"
      - "internal/transport/v1/_pb_rest.txt"
      - ".github/workflows/assemble-pb.yml"
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f7-02-request-dsl
      - name: Assemble service.pb.go
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts = [
            Path("internal/transport/v1/_pb_prefix.txt").read_bytes(),
            Path("internal/transport/v1/_suffix_probe.txt").read_bytes(),
            Path("internal/transport/v1/_pb_rest.txt").read_bytes(),
          ]
          data = b"".join(parts)
          Path("internal/transport/v1/service.pb.go").write_bytes(data)
          print("bytes", len(data))
          print(hashlib.sha256(data).hexdigest())
          bs = bytes([0x5c])
          assert len(data) == 12084
          assert data.count(bs + b"x03(") == 5
          assert (bs + b"x003(") not in data
          assert hashlib.sha256(data).hexdigest() == "2245a5d75d813e1e7ebaffbca95c070a7109dcb6c6217543ff49ff522d3467ae"
          PY
      - name: Commit
        run: |
          git config user.name "Samuel Fabel"
          git config user.email "samuelfabel@hotmail.com"
          git add internal/transport/v1/service.pb.go
          git commit -m "fix: corrige escape sequences em service.pb.go" || exit 0
          git push
